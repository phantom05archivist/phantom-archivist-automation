name: Phantom Archivist Daily Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

jobs:
  daily-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test YouTube API secret
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "ERROR: YOUTUBE_API_KEY is not configured."
            exit 1
          fi

          echo "SUCCESS: YouTube API key is available to the workflow."
          echo "The key itself will NOT be displayed."
